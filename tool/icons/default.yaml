flutter_launcher_icons:
  # The default launcher icon.
  #
  # Two files, because the two Android icon systems want different things.
  # `default.png` is the artwork at full bleed and becomes the legacy
  # mipmap, which is what Android 7 and older draw edge to edge.
  # `default_adaptive.png` is the same artwork scaled to 70% on a field of
  # its own background colour, and becomes the adaptive foreground: the launcher
  # masks that layer to a circle of 72dp inside the 108dp canvas, so artwork that
  # filled the canvas lost its corners. At 70% the whole illustration sits inside
  # the mask with a margin, and the field is the artwork's own corner colour, so
  # nothing shows a seam.
  #
  # adaptive_icon_foreground_inset stays 0 because the padding is already baked
  # into the file. Insets here would shrink the artwork a second time.
  android: "ic_launcher"
  ios: false
  image_path: "assets/app_icons/default.png"
  min_sdk_android: 21
  adaptive_icon_background: "#1A4632"
  adaptive_icon_foreground: "assets/app_icons/default_adaptive.png"
  adaptive_icon_foreground_inset: 0
