name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'lib/**'
      - 'assets/**'
      - 'android/**'
      - 'pubspec.yaml'
      - 'pubspec.lock'
      - '.github/workflows/build_android.yml'
  pull_request:
    paths:
      - 'lib/**'
      - 'assets/**'
      - 'android/**'
      - 'pubspec.yaml'
      - 'pubspec.lock'

# Required by softprops/action-gh-release to create the tag and attach the
# APK. Without it the release step fails with "Resource not accessible by
# integration", which is exactly what makes the download URL 404.
permissions: { contents: write }

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.8'
          channel: stable
          cache: true

      - name: Resolve dependencies
        run: flutter pub get

      - name: Generate Drift code
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Generate launcher icons
        # Three passes, one per launcher icon. The default run reads the
        # flutter_launcher_icons block in pubspec.yaml; the two Pro variants
        # read their own config files because the generator only accepts one
        # icon set per invocation. All three have to exist before the APK is
        # assembled: the manifest points at them by name from its
        # activity-alias entries, and a missing mipmap fails the resource
        # link step rather than the icon switch at runtime.
        run: |
          dart run flutter_launcher_icons
          dart run flutter_launcher_icons -f flutter_launcher_icons_crown.yaml
          dart run flutter_launcher_icons -f flutter_launcher_icons_blue.yaml

      - name: Prepare release signing
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          # KEYSTORE_BASE64 is the authoritative keystore whose SHA-1 is
          # registered in Google Cloud. The committed bitaqati.p12 is only a
          # fallback for environments where the secret is unavailable.
          if [ -n "${KEYSTORE_BASE64:-}" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > android/app/bitaqati.p12
            echo "Decoded keystore from KEYSTORE_BASE64."
          elif [ -f bitaqati.p12 ]; then
            cp bitaqati.p12 android/app/bitaqati.p12
            echo "Using repository keystore bitaqati.p12."
          fi

          if [ -f android/app/bitaqati.p12 ] \
            && [ -n "${KEYSTORE_PASSWORD:-}" ] \
            && [ -n "${KEY_ALIAS:-}" ] \
            && [ -n "${KEY_PASSWORD:-}" ]; then
            chmod 600 android/app/bitaqati.p12
            {
              echo "storePassword=${KEYSTORE_PASSWORD}"
              echo "keyPassword=${KEY_PASSWORD}"
              echo "keyAlias=${KEY_ALIAS}"
              echo "storeFile=bitaqati.p12"
            } > android/key.properties
            chmod 600 android/key.properties
            echo "Release signing enabled."
          else
            echo "::warning::Release signing secrets are missing; this APK will be debug-signed."
            if [ "$EVENT_NAME" != "pull_request" ]; then
              echo "::error::Refusing to publish a debug-signed APK. Set KEYSTORE_PASSWORD, KEY_ALIAS, and KEY_PASSWORD."
              exit 1
            fi
          fi

      - name: Check formatting
        continue-on-error: true
        run: dart format --output=none --set-exit-if-changed $(git ls-files 'lib/*.dart')

      - name: Analyze
        run: flutter analyze

      - name: Build split release APKs
        run: |
          flutter build apk --release --split-per-abi \
            --dart-define=SUPABASE_URL="${{ secrets.SUPABASE_URL }}" \
            --dart-define=SUPABASE_PUBLISHABLE_KEY="${{ secrets.SUPABASE_PUBLISHABLE_KEY }}" \
            --dart-define=GOOGLE_WEB_CLIENT_ID="${{ secrets.GOOGLE_WEB_CLIENT_ID }}"

      - name: Name the release and rename the APKs
        id: release
        run: |
          # The tag comes from pubspec so the in-app updater can compare
          # `tag_name` with the installed version. A per-run tag would make
          # /releases/latest unpredictable and the version check meaningless.
          VERSION=$(sed -n 's/^version:[[:space:]]*\([0-9][0-9.]*\).*/\1/p' pubspec.yaml | head -1)
          if [ -z "$VERSION" ]; then
            echo "::error::Could not read the version from pubspec.yaml."
            exit 1
          fi
          TAG="v${VERSION}"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          mkdir -p dist

          # A fixed asset name is what makes the download URL stable:
          # https://github.com/7sn-17/bitaqati/releases/latest/download/bitaqati.apk
          cp "build/app/outputs/flutter-apk/app-arm64-v8a-release.apk" \
            "dist/bitaqati.apk"

          for abi in arm64-v8a armeabi-v7a x86_64; do
            cp "build/app/outputs/flutter-apk/app-${abi}-release.apk" \
              "dist/bitaqati-${TAG}-${abi}.apk"
          done
          ls -lh dist

          # The in-app update dialog shows this text verbatim, so it is written
          # for a person: what changed, no file names, no download advice.
          # It is cut from CHANGELOG.md rather than typed here so the release
          # page and the dialog can never disagree, and so the notes change
          # with the code instead of staying frozen at the first release.
          NOTES="dist/notes.md"
          if [ -f CHANGELOG.md ]; then
            awk -v ver="$VERSION" '
              $0 ~ "^##[[:space:]]+" ver "([[:space:]]|$)" { found = 1; next }
              found && /^##[[:space:]]/ { exit }
              found { print }
            ' CHANGELOG.md > "$NOTES"
          fi
          if [ ! -s "$NOTES" ]; then
            printf 'تحسينات وإصلاحات في هذا الإصدار.\n' > "$NOTES"
          fi
          echo "--- release notes ---"
          cat "$NOTES"

      - name: Verify APK signer
        env:
          EXPECTED_SHA1: ${{ vars.ANDROID_CERT_SHA1 }}
        run: |
          APK="dist/bitaqati-${{ steps.release.outputs.tag }}-arm64-v8a.apk"
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          APKSIGNER=$(find "$SDK/build-tools" -name apksigner -type f 2>/dev/null | sort -V | tail -1 || true)
          if [ -z "$APKSIGNER" ]; then
            echo "::warning::apksigner not found; cannot print the APK SHA-1."
            exit 0
          fi
          CERT_LINE=$("$APKSIGNER" verify --print-certs "$APK" | grep -m1 "SHA-1 digest" || true)
          if [ -z "$CERT_LINE" ]; then
            echo "::warning::Could not read the APK certificate."
            exit 0
          fi
          echo "APK signer: $CERT_LINE"
          SHA1=$(echo "$CERT_LINE" | awk '{print $NF}')
          if [ -n "${EXPECTED_SHA1:-}" ] && [ "$SHA1" != "$EXPECTED_SHA1" ]; then
            echo "::error::APK SHA-1 ($SHA1) does not match ANDROID_CERT_SHA1 ($EXPECTED_SHA1)."
            exit 1
          fi

      - name: Upload APKs as workflow artifacts
        uses: actions/upload-artifact@v7
        with:
          name: bitaqati-apks
          path: dist/*.apk
          if-no-files-found: error
          retention-days: 30

      # Attaches the APK to a real GitHub Release (not just a workflow
      # artifact) so /releases/latest/download/bitaqati.apk always resolves to
      # the newest build. The in-app updater reads this release's tag and body,
      # and the body is the changelog section written above — never a list of
      # assets, because that list is what the update dialog used to show.
      - name: Publish to GitHub Releases
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: "بطاقاتي ${{ steps.release.outputs.version }}"
          body_path: dist/notes.md
          files: |
            dist/bitaqati.apk
            dist/bitaqati-${{ steps.release.outputs.tag }}-arm64-v8a.apk
            dist/bitaqati-${{ steps.release.outputs.tag }}-armeabi-v7a.apk
            dist/bitaqati-${{ steps.release.outputs.tag }}-x86_64.apk
          prerelease: false
          make_latest: true
          fail_on_unmatched_files: true
