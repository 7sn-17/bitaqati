name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'lib/**'
      - 'assets/**'
      - 'android/**'
      - 'pubspec.yaml'
      - 'pubspec.lock'
      - '.github/workflows/build_android.yml'
  pull_request:
    paths:
      - 'lib/**'
      - 'assets/**'
      - 'android/**'
      - 'pubspec.yaml'
      - 'pubspec.lock'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.8'
          channel: stable
          cache: true

      - name: Resolve dependencies
        run: flutter pub get

      - name: Generate Drift code
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Generate launcher icons
        run: dart run flutter_launcher_icons

      - name: Check formatting
        continue-on-error: true
        run: dart format --output=none --set-exit-if-changed $(git ls-files 'lib/*.dart')

      - name: Analyze
        run: flutter analyze

      - name: Build split release APKs
        run: |
          flutter build apk --release --split-per-abi \
            --dart-define=SUPABASE_URL="${{ secrets.SUPABASE_URL }}" \
            --dart-define=SUPABASE_PUBLISHABLE_KEY="${{ secrets.SUPABASE_PUBLISHABLE_KEY }}" \
            --dart-define=GOOGLE_WEB_CLIENT_ID="${{ secrets.GOOGLE_WEB_CLIENT_ID }}"

      - name: Name the release and rename the APKs
        id: release
        run: |
          BRANCH="${GITHUB_REF_NAME//[^A-Za-z0-9._-]/-}"
          TAG="build-${BRANCH}-${GITHUB_RUN_NUMBER}"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          mkdir -p dist
          for abi in arm64-v8a armeabi-v7a x86_64; do
            cp "build/app/outputs/flutter-apk/app-${abi}-release.apk" \
              "dist/bitaqati-${TAG}-${abi}.apk"
          done
          ls -lh dist

      - name: Upload APKs as workflow artifacts
        uses: actions/upload-artifact@v7
        with:
          name: bitaqati-apks
          path: dist/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish to GitHub Releases
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: "بطاقاتي ${{ steps.release.outputs.tag }}"
          body: |
            نسخة تجريبية مبنية تلقائياً من الفرع `${{ github.ref_name }}`
            (تشغيل رقم ${{ github.run_number }}).

            ### أي ملف أنزّل؟
            - `arm64-v8a`: الأنسب لمعظم هواتف أندرويد الحديثة.
            - `armeabi-v7a`: للهواتف القديمة ذات 32 بت.
            - `x86_64`: للمحاكيات فقط.
          files: dist/*.apk
          prerelease: true
          fail_on_unmatched_files: true
