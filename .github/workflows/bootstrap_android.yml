name: Bootstrap Android Host

on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/bootstrap_android.yml

permissions:
  contents: read

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Show versions
        run: |
          flutter --version
          java -version

      - name: Generate Android host project
        run: |
          flutter create --platforms=android --org app.bitaqati --project-name cards /tmp/boot
          rm -rf android
          mkdir -p android
          cp -R /tmp/boot/android/. android/
          sed -i 's/android:label="cards"/android:label="بطاقاتي"/' android/app/src/main/AndroidManifest.xml
          find android -maxdepth 3 -type f | sort | head -40

      - name: Install packages
        run: flutter pub get

      - name: Analyze
        continue-on-error: true
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Build debug APK
        run: flutter build apk --debug

      - name: Clean generated host cache
        if: always()
        run: |
          rm -rf android/.gradle android/local.properties android/app/build android/build
          find android -maxdepth 2 -type f | sort

      - name: Upload Android host
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-host
          path: android
          if-no-files-found: warn

      - name: Upload debug APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bitaqati-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: warn
