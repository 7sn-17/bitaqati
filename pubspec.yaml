name: bitaqati
# Android application ID: com.bitaqati.app (android/app/build.gradle.kts).
# Dart package names cannot contain dots, so the pub package stays `bitaqati`.
description: "بطاقاتي — تطبيق بطاقات تعليمية ذكي للمراجعة المتباعدة."
publish_to: "none"
version: 0.2.0+2

environment:
  sdk: ">=3.13.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^2.6.1
  go_router: ^14.6.2
  shared_preferences: ^2.3.3
  drift: ^2.35.3
  drift_flutter: ^0.3.1
  uuid: ^4.6.0
  supabase_flutter: ^2.18.3
  google_sign_in: ^7.2.0
  app_links: ^7.2.2
  flutter_svg: ^2.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.4
  drift_dev: ^2.35.2
  build_runner: ^2.17.1

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icon.png"
  min_sdk_android: 23
  adaptive_icon_background: "#FFFFFD"
  adaptive_icon_foreground: "assets/icon.png"
  adaptive_icon_foreground_inset: 16

flutter:
  uses-material-design: true
  assets:
    - assets/icon.png
    - assets/fonts/
    - assets/branding/
    - assets/icons/
    - assets/illustrations/
  fonts:
    - family: ReadexPro
      fonts:
        - asset: assets/fonts/ReadexPro-Regular.ttf
          weight: 400
        - asset: assets/fonts/ReadexPro-Medium.ttf
          weight: 500
        - asset: assets/fonts/ReadexPro-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/ReadexPro-bold.ttf
          weight: 700
    - family: IBMPlexSansArabic
      fonts:
        - asset: assets/fonts/IBMPlexSansArabic-Regular.ttf
          weight: 400
        - asset: assets/fonts/IBMPlexSansArabic-Medium.ttf
          weight: 500
        - asset: assets/fonts/IBMPlexSansArabic-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/IBMPlexSansArabic-Bold.ttf
          weight: 700
