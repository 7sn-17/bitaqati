name: bitaqati
description: "بطاقاتي — تطبيق بطاقات تعليمية ذكي للمراجعة المتباعدة."
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.13.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  app_links: ^7.2.2
  cached_network_image: ^3.4.1
  connectivity_plus: ^6.1.0
  cupertino_icons: ^1.0.8
  drift: ^2.28.0
  drift_flutter: ^0.2.4
  file_picker: ^13.3.0
  flutter_animate: ^4.5.2
  font_awesome_flutter: ^10.7.0
  flutter_riverpod: ^2.6.1
  flutter_svg: ^2.0.17
  flutter_tts: ^4.2.0
  go_router: ^14.6.2
  google_sign_in: ^7.2.0
  image_picker: ^1.2.4
  shared_preferences: ^2.3.3
  supabase_flutter: ^2.18.3
  url_launcher: ^6.3.0
  uuid: ^4.5.1

dev_dependencies:
  build_runner: ^2.4.15
  drift_dev: ^2.28.0
  flutter_launcher_icons: ^0.14.3
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/branding/
    - assets/fonts/
    - assets/onboarding/
  fonts:
    - family: ReadexPro
      fonts:
        - asset: assets/fonts/ReadexPro-Regular.ttf
          weight: 400
        - asset: assets/fonts/ReadexPro-Medium.ttf
          weight: 500
        - asset: assets/fonts/ReadexPro-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/ReadexPro-bold.ttf
          weight: 700
    - family: IBMPlexSansArabic
      fonts:
        - asset: assets/fonts/IBMPlexSansArabic-Regular.ttf
          weight: 400
        - asset: assets/fonts/IBMPlexSansArabic-Medium.ttf
          weight: 500
        - asset: assets/fonts/IBMPlexSansArabic-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/IBMPlexSansArabic-Bold.ttf
          weight: 700

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/branding/icon.png"
  min_sdk_android: 21
  adaptive_icon_background: "#FFFEFC"
  adaptive_icon_foreground: "assets/branding/icon.png"
  adaptive_icon_foreground_inset: 12
