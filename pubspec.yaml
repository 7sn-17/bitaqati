name: bitaqati
description: "بطاقاتي — تطبيق بطاقات تعليمية ذكي للمراجعة المتباعدة."
publish_to: "none"
version: 1.9.1+13

environment:
  sdk: ">=3.13.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  app_links: ^7.2.2
  audioplayers: ^6.8.1
  cached_network_image: ^3.4.1
  connectivity_plus: ^6.1.0
  cupertino_icons: ^1.0.8
  device_info_plus: ^13.3.0
  drift: ^2.28.0
  drift_flutter: ^0.2.4
  file_picker: ^13.3.0
  fl_chart: ^1.3.0
  flutter_animate: ^4.5.2
  flutter_image_compress: ^2.5.1
  flutter_local_notifications: ^22.3.3
  # flutter_dynamic_icon stops at Dart <3.0; this is the maintained fork with
  # the same API and an Android build that matches this project's toolchain.
  flutter_dynamic_icon_plus: ^1.6.0
  flutter_riverpod: ^2.6.1
  flutter_svg: ^2.0.17
  flutter_timezone: ^5.1.1
  flutter_tts: ^4.2.0
  font_awesome_flutter: ^11.0.0
  fsrs: ^2.0.1
  go_router: ^14.6.2
  google_sign_in: ^7.2.0
  http: ^1.6.0
  image_cropper: ^13.0.0
  image_picker: ^1.2.4
  package_info_plus: ^10.2.2
  path_provider: ^2.1.6
  # Pinned to 12.x: permission_handler_android 14 requires compileSdk 37, and
  # the Android Gradle plugin this project uses caps out at 36.
  permission_handler: ^12.0.3
  photo_view: ^0.15.0
  record: ^7.1.2
  share_plus: ^13.3.1
  shared_preferences: ^2.3.3
  shimmer: ^4.0.0
  supabase_flutter: ^2.18.3
  timezone: ^0.11.2
  url_launcher: ^6.3.0
  uuid: ^4.5.1

dev_dependencies:
  build_runner: ^2.4.15
  drift_dev: ^2.28.0
  flutter_launcher_icons: ^0.14.3
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/app_icons/
    - assets/branding/
    - assets/fonts/
    - assets/onboarding/
    - assets/sounds/
  fonts:
    - family: ReadexPro
      fonts:
        - asset: assets/fonts/ReadexPro-Regular.ttf
          weight: 400
        - asset: assets/fonts/ReadexPro-Medium.ttf
          weight: 500
        - asset: assets/fonts/ReadexPro-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/ReadexPro-bold.ttf
          weight: 700
    - family: Cairo
      fonts:
        - asset: assets/fonts/Cairo-Medium.ttf
          weight: 500
        - asset: assets/fonts/Cairo-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Cairo-bold.ttf
          weight: 700
        - asset: assets/fonts/Cairo-ExtraBold.ttf
          weight: 800
    - family: IBMPlexSansArabic
      fonts:
        - asset: assets/fonts/IBMPlexSansArabic-Regular.ttf
          weight: 400
        - asset: assets/fonts/IBMPlexSansArabic-Medium.ttf
          weight: 500
        - asset: assets/fonts/IBMPlexSansArabic-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/IBMPlexSansArabic-Bold.ttf
          weight: 700

# The default launcher icon. The artwork is full-bleed on purpose: it becomes
# both the legacy mipmap and the adaptive foreground, so a device on Android 8+
# and one on Android 7 see the same picture instead of the adaptive layer
# quietly falling back to an older logo. The background colour matches the
# artwork's corner, which is what shows through if a launcher insets the
# foreground further than this build expects.
flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/app_icons/default.png"
  min_sdk_android: 21
  adaptive_icon_background: "#1A4632"
  adaptive_icon_foreground: "assets/app_icons/default.png"
  adaptive_icon_foreground_inset: 0
